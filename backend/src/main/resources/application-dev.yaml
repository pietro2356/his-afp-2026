spring:
  datasource:
    # URL di connessione (di default PostgreSQL su docker espone la 5432)
    url: jdbc:postgresql://localhost:5432/sio_db?currentSchema=sio
    username: sio_user
    password: sio_password
    driver-class-name: org.postgresql.Driver

  jpa:
    # Mostra le query SQL in console (utilissimo per la didattica!)
    show-sql: true
    hibernate:
      # 'none' perché le tabelle sono già create dal file init.sql
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    com.sio.backend: debug
    org.hibernate.sql: debug
    org.hibernate.type.descriptor.sql: trace
