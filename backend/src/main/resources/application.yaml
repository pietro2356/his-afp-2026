spring:
  application:
    name: sio-backend
  profiles:
    active:
      - dev

# Configurazione porta del backend
server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json


management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      cors:
        allowed-origins:
          - http://localhost:4200
        allowed-methods:
          - GET