<!---
  IMG | [strutt+reparto] -- [btn::tema]
-->
<header class="flex flex-row items-center shadow-md backdrop-opacity-5">
  <!-- IMG CONTAINER -->
  <div>
    <img
      class="w-40"
      alt="logo azienda sanitaria"
      src="logo-asuit.svg">
  </div>

  <!-- DIVIDER -->
  <!--  <div></div>-->
  <p-divider layout="vertical"/>

  <!-- STRUTTURA + REPARTO -->
  <div>
    <!--  REPARTO  -->
    <h1 class="text-4xl font-bold">{{reparto()}}</h1>
    <!--  STRUTTURA  -->
    <p>
      {{struttura()}} {{ambiente()}}

      @switch (ambiente()){
        @case ('T'){
          <p-tag
            severity="info"
            value="{{versione()}} - {{ambiente()}}"
          />
        }
        @case ('P'){
          <p-tag
            severity="success"
            value="{{versione()}} - {{ambiente()}}"
          />
        }
        @default {
          <p-tag
            severity="contrast"
            value="{{versione()}} - {{ambiente()}}"
          />
        }
      }
    </p>

  </div>

  <!-- AZIONI -->
  <div class="ml-auto mr-4">
    <sio-toggle-theme/>
  </div>
</header>
